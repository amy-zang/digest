<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Daily Digest — Sunday, May 25, 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #fffaf3;
    --paper-2: #fdf2e4;
    --paper-3: #f5e6d0;
    --ink: #3d2a44;
    --ink-2: #6b5172;
    --ink-3: #a896ad;
    --rule: #3d2a44;

    --pink-bg: #ffe3ec;
    --pink-soft: #fff0f4;
    --pink-ink: #c64a7a;
    --pink-deep: #9a3460;

    --sky-bg: #d9ecff;
    --sky-soft: #ecf5ff;
    --sky-ink: #3a7dbf;
    --sky-deep: #245a92;

    --lav-bg: #e6dcfa;
    --lav-soft: #f1ebfc;
    --lav-ink: #7a55c9;
    --lav-deep: #563594;

    --mint-bg: #d4f0dc;
    --mint-soft: #e8f7ec;
    --mint-ink: #3e9c5e;
    --mint-deep: #2a7444;

    --peach-bg: #ffdcc7;
    --peach-soft: #fff0e3;
    --peach-ink: #d76a3a;
    --peach-deep: #a04a22;

    --butter-bg: #fff1b8;
    --butter-soft: #fff8db;
    --butter-ink: #c79520;
    --butter-deep: #8e6912;

    --terracotta: var(--pink-ink);
    --terracotta-deep: var(--pink-deep);
    --forest: var(--mint-deep);
    --gold: var(--butter-ink);
    --sun: #ffd66a;

    --serif: "IBM Plex Mono", Menlo, ui-monospace, monospace;
    --mono: "JetBrains Mono", Menlo, ui-monospace, monospace;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--paper); color: var(--ink); }
  body {
    font-family: var(--serif);
    font-size: 15px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    background-image: radial-gradient(rgba(61,42,68,0.06) 1px, transparent 1.4px);
    background-size: 14px 14px;
  }
  .digest { max-width: 1240px; margin: 0 auto; padding: 28px 56px 96px; position: relative; }

  /* ── Masthead ── */
  .masthead {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: end;
    gap: 24px;
    padding-bottom: 12px;
    border-bottom: 4px double var(--rule);
    position: relative;
  }
  .masthead::after {
    content: "";
    position: absolute;
    left: 0; right: 0; bottom: -8px;
    height: 2px;
    background-image: radial-gradient(circle, var(--pink-ink) 1.2px, transparent 1.6px);
    background-size: 10px 2px;
    background-repeat: repeat-x;
  }
  .masthead .left, .masthead .right {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--ink-2);
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .masthead .left { align-items: flex-start; }
  .masthead .right { align-items: flex-end; text-align: right; }
  .wordmark {
    font-family: var(--serif);
    font-weight: 600;
    font-size: 28px;
    line-height: 1;
    letter-spacing: -.03em;
    text-align: center;
  }
  .wordmark .digest-word { font-weight: 700; letter-spacing: -.02em; color: var(--ink); }

  /* ── Greeting ── */
  .greeting {
    padding: 28px 0 24px;
    display: grid;
    grid-template-columns: 1.6fr 1fr;
    gap: 56px;
    align-items: end;
    border-bottom: 2px dashed var(--ink);
  }
  .greeting h1 { font-family: var(--serif); font-weight: 500; font-size: 36px; line-height: 1.15; letter-spacing: -.02em; margin: 0; color: var(--ink); text-wrap: balance; }
  .greeting h1 .signature { font-style: italic; font-weight: 700; color: var(--pink-ink); background: var(--pink-bg); padding: 0 8px; border-radius: 6px; }
  .greeting .meta { font-family: var(--mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); line-height: 1.7; }
  .greeting .meta b { color: var(--ink); font-weight: 600; }

  /* ── Section primitive ── */
  .section {
    padding: 32px 0;
    border-bottom: 2px dotted var(--ink);
    --accent: var(--ink);
    --accent-deep: var(--ink);
    --accent-bg: var(--paper-2);
    --accent-soft: var(--paper);
  }
  .section:last-of-type { border-bottom: none; }
  .section.theme-pink   { --accent: var(--pink-ink);   --accent-deep: var(--pink-deep);   --accent-bg: var(--pink-bg);   --accent-soft: var(--pink-soft); }
  .section.theme-sky    { --accent: var(--sky-ink);    --accent-deep: var(--sky-deep);    --accent-bg: var(--sky-bg);    --accent-soft: var(--sky-soft); }
  .section.theme-lav    { --accent: var(--lav-ink);    --accent-deep: var(--lav-deep);    --accent-bg: var(--lav-bg);    --accent-soft: var(--lav-soft); }
  .section.theme-mint   { --accent: var(--mint-ink);   --accent-deep: var(--mint-deep);   --accent-bg: var(--mint-bg);   --accent-soft: var(--mint-soft); }
  .section.theme-peach  { --accent: var(--peach-ink);  --accent-deep: var(--peach-deep);  --accent-bg: var(--peach-bg);  --accent-soft: var(--peach-soft); }
  .section.theme-butter { --accent: var(--butter-ink); --accent-deep: var(--butter-deep); --accent-bg: var(--butter-bg); --accent-soft: var(--butter-soft); }

  .kicker { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 28px; }
  .kicker .label {
    font-family: var(--mono);
    font-size: 18px;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: var(--accent-deep);
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .kicker .label::before {
    content: "";
    width: 30px;
    height: 6px;
    background-image: radial-gradient(circle, var(--accent) 1.6px, transparent 2px);
    background-size: 8px 6px;
    background-repeat: repeat-x;
    background-position: center;
  }
  .kicker .label .glyph { display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; line-height: 0; }
  .kicker .label .num {
    font-family: var(--serif);
    font-style: italic;
    font-weight: 700;
    font-size: 28px;
    letter-spacing: 0;
    text-transform: none;
    color: var(--accent);
    background: var(--accent-bg);
    padding: 2px 10px;
    border-radius: 999px;
  }
  .kicker .tag { font-family: var(--mono); font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); }

  /* ── Top stories + weather ── */
  .top-row { display: grid; grid-template-columns: 1.7fr 1fr; gap: 56px; }
  .stories { display: flex; flex-direction: column; }
  .story {
    display: grid;
    grid-template-columns: 200px 1fr;
    gap: 22px;
    padding: 22px 0;
    border-top: 2px dotted var(--accent);
  }
  .story:nth-child(odd) { border-top-style: dashed; }
  .story:first-child { border-top: none; padding-top: 0; grid-template-columns: 1fr; padding-bottom: 28px; }
  .story-img {
    background: var(--accent-bg);
    border: 1.5px dashed var(--accent);
    border-radius: 14px;
    position: relative;
    aspect-ratio: 4/3;
    overflow: hidden;
  }
  .story:first-child .story-img { aspect-ratio: 16/8; border-style: solid; border-radius: 18px; }
  .story-img::before {
    content: "";
    position: absolute; inset: 0;
    background-image: repeating-linear-gradient(45deg, transparent 0, transparent 10px, rgba(61,42,68,.06) 10px, rgba(61,42,68,.06) 11px);
    pointer-events: none;
  }
  .story-img.has-photo::before { display: none; }
  .story-img img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .story-img .caption {
    position: absolute;
    inset: auto 8px 8px 8px;
    font-family: var(--mono);
    font-size: 9.5px;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--accent-deep);
    background: var(--paper);
    padding: 4px 8px;
    border: 1.5px dotted var(--accent);
    border-radius: 999px;
    display: inline-block;
    width: fit-content;
  }
  .story-body { display: flex; flex-direction: column; gap: 6px; }
  .story-cat { font-family: var(--mono); font-size: 10px; letter-spacing: .18em; text-transform: uppercase; color: var(--accent-deep); font-weight: 600; }
  .story-headline { font-family: var(--serif); font-weight: 600; font-size: 20px; line-height: 1.2; letter-spacing: -.015em; margin: 0; color: var(--ink); text-wrap: balance; }
  .story:first-child .story-headline { font-size: 26px; }
  .story-deck { font-family: var(--serif); font-style: italic; font-size: 14.5px; line-height: 1.45; color: var(--ink-2); margin: 4px 0 0; }
  .story-meta { font-family: var(--mono); font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); margin-top: 8px; display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
  .story-meta a { color: var(--ink); text-decoration: none; border-bottom: 1.5px dotted var(--accent); padding-bottom: 1px; }
  .story-meta a:hover { color: var(--accent-deep); border-bottom-style: solid; }
  .bias-pill { display: inline-flex; align-items: center; gap: 6px; font-family: var(--mono); font-size: 9.5px; letter-spacing: .12em; padding: 3px 9px; border: 1.5px dotted var(--accent); color: var(--accent-deep); text-transform: uppercase; background: var(--accent-soft); border-radius: 999px; }
  .bias-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--mint-ink); display: inline-block; }

  /* ── Weather ── */
  .weather {
    border: 2px solid var(--sky-ink);
    border-radius: 18px;
    background: linear-gradient(180deg, var(--sky-bg) 0%, var(--sky-soft) 100%);
    padding: 22px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    position: relative;
  }
  .weather::before {
    content: "";
    position: absolute; inset: 6px;
    border: 1.5px dotted var(--sky-ink);
    border-radius: 12px;
    pointer-events: none;
  }
  .weather-head { display: flex; justify-content: space-between; align-items: baseline; border-bottom: 2px dashed var(--sky-ink); padding-bottom: 10px; position: relative; z-index: 1; }
  .weather-head .tag { font-family: var(--mono); font-size: 10px; letter-spacing: .2em; text-transform: uppercase; color: var(--sky-deep); }
  .weather-head .place { font-family: var(--serif); font-style: italic; font-size: 16px; color: var(--ink); }
  .weather-now { display: flex; align-items: center; gap: 14px; position: relative; z-index: 1; }
  .temp { font-family: var(--serif); font-weight: 700; font-size: 56px; line-height: .95; letter-spacing: -.05em; color: var(--sky-deep); display: flex; align-items: flex-start; flex-shrink: 0; }
  .temp .deg { font-size: 26px; font-weight: 500; margin-top: 6px; color: var(--peach-ink); }
  .weather-right { display: flex; flex-direction: column; gap: 3px; }
  .weather-cond { font-family: var(--serif); font-weight: 700; font-size: 17px; color: var(--ink); }
  .weather-hl { font-family: var(--mono); font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--sky-deep); }
  .w-chips { display: flex; gap: 6px; flex-wrap: wrap; position: relative; z-index: 1; }
  .w-chip { font-family: var(--mono); font-size: 9.5px; letter-spacing: .12em; text-transform: uppercase; padding: 4px 9px; border-radius: 999px; border: 1.5px dotted; white-space: nowrap; }
  .w-chip.uv-low  { border-color: var(--mint-ink);  color: var(--mint-deep);  background: var(--mint-soft); }
  .w-chip.uv-mod  { border-color: var(--butter-ink); color: var(--butter-deep); background: var(--butter-soft); }
  .w-chip.uv-high { border-color: var(--peach-ink); color: var(--peach-deep); background: var(--peach-soft); }
  .w-chip.chip-ok   { border-color: var(--mint-ink);  color: var(--mint-deep);  background: var(--mint-soft); }
  .w-chip.chip-rain { border-color: var(--sky-ink);  color: var(--sky-deep);  background: var(--sky-bg); }
  .w-chip.chip-wind { border-color: var(--lav-ink);  color: var(--lav-deep);  background: var(--lav-soft); }
  .weather-hours { display: grid; grid-template-columns: repeat(5, 1fr); border: 1.5px dotted var(--sky-ink); border-radius: 10px; background: var(--paper); overflow: hidden; position: relative; z-index: 1; }
  .hour { text-align: center; padding: 10px 0; border-right: 1.5px dotted var(--sky-ink); display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .hour:last-child { border-right: none; }
  .hour .h { font-family: var(--mono); font-size: 9.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--sky-deep); }
  .hour .t { font-family: var(--serif); font-size: 16px; font-weight: 700; color: var(--ink); }
  .hour .ic { display: flex; align-items: center; justify-content: center; }
  .weather-outfit { border-top: 2px dashed var(--sky-ink); padding-top: 12px; position: relative; z-index: 1; }
  .outfit-title { font-family: var(--mono); font-size: 10px; letter-spacing: .18em; text-transform: uppercase; color: var(--sky-deep); font-weight: 700; margin-bottom: 8px; }
  .outfit-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
  .outfit-list li { display: grid; grid-template-columns: 72px 1fr; gap: 6px; align-items: baseline; }
  .outfit-label { font-family: var(--mono); font-size: 9px; letter-spacing: .14em; text-transform: uppercase; color: var(--sky-deep); font-weight: 700; }
  .outfit-val { font-family: var(--serif); font-size: 13px; color: var(--ink); line-height: 1.3; }
  .sun-times { margin-top: 10px; font-family: var(--mono); font-size: 9.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); display: flex; justify-content: space-between; }
  .forecast7 { border-top: 2px dashed var(--sky-ink); padding-top: 12px; position: relative; z-index: 1; }
  .forecast7-title { font-family: var(--mono); font-size: 10px; letter-spacing: .18em; text-transform: uppercase; color: var(--sky-deep); font-weight: 700; margin-bottom: 8px; }
  .forecast7-grid { display: grid; grid-template-columns: repeat(7, 1fr); border: 1.5px dotted var(--sky-ink); border-radius: 10px; background: var(--paper); overflow: hidden; }
  .fday { display: flex; flex-direction: column; align-items: center; padding: 8px 3px; gap: 3px; border-right: 1.5px dotted var(--sky-ink); }
  .fday:last-child { border-right: none; }
  .fday.today { background: var(--sky-soft); }
  .fday-label { font-family: var(--mono); font-size: 8px; letter-spacing: .1em; text-transform: uppercase; color: var(--sky-deep); white-space: nowrap; }
  .fday-ic { display: flex; align-items: center; justify-content: center; }
  .fday-high { font-family: var(--serif); font-size: 12px; font-weight: 700; color: var(--ink); line-height: 1; }
  .fday-bar-wrap { width: 4px; flex: 1; min-height: 22px; border-radius: 2px; background: var(--sky-bg); position: relative; overflow: hidden; }
  .fday-bar-fill { position: absolute; left: 0; right: 0; border-radius: 2px; background: var(--sky-ink); }
  .fday-bar-fill.rain { background: var(--lav-ink); }
  .fday-low { font-family: var(--mono); font-size: 9px; color: var(--ink-3); line-height: 1; }

  /* ── Tech ── */
  .tech-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; border-top: 3px dotted var(--accent); padding-top: 22px; }
  .tech-card { padding: 20px 22px; background: var(--accent-soft); border: 1.5px dashed var(--accent); border-radius: 16px; display: flex; flex-direction: column; gap: 8px; }
  .tech-card:nth-child(2) { border-style: solid; background: var(--accent-bg); }
  .tech-num { font-family: var(--serif); font-style: italic; font-size: 28px; font-weight: 700; color: var(--accent); line-height: 1; background: var(--paper); width: fit-content; padding: 4px 12px; border-radius: 999px; border: 1.5px dotted var(--accent); }
  .tech-card h3 { font-family: var(--serif); font-weight: 600; font-size: 16.5px; line-height: 1.25; letter-spacing: -.015em; margin: 4px 0 0; color: var(--ink); text-wrap: balance; }
  .tech-card p { font-family: var(--serif); font-size: 14px; line-height: 1.45; color: var(--ink-2); margin: 2px 0 0; }
  .tech-card .src { font-family: var(--mono); font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--accent-deep); margin-top: auto; padding-top: 14px; display: flex; justify-content: space-between; }
  .tech-card .src a { color: var(--accent-deep); border-bottom: 1.5px dotted var(--accent); text-decoration: none; padding-bottom: 1px; }

  /* ── Events ── */
  .events-row { display: grid; grid-template-columns: 1fr 1fr; gap: 0; }
  .events-col { padding: 0; }
  .events-col + .events-col { border-left: 2px dotted var(--accent); padding-left: 36px; }
  .events-col:first-child { padding-right: 36px; }
  .events-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 16px; }
  .events-head h2 { font-family: var(--serif); font-weight: 500; font-size: 22px; letter-spacing: -.02em; margin: 0; color: var(--ink); display: flex; align-items: center; gap: 12px; }
  .events-head h2 .head-icon { display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; line-height: 0; }
  .events-head h2 b { font-weight: 700; color: var(--accent-deep); }
  .events-head .span { font-family: var(--mono); font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--accent-deep); background: var(--accent-bg); padding: 4px 10px; border-radius: 999px; }
  .event { display: grid; grid-template-columns: 64px 1fr auto; gap: 14px; padding: 14px 0; border-top: 1.5px dashed var(--accent); align-items: start; }
  .event:nth-child(even) { border-top-style: dotted; border-top-width: 2px; }
  .event-date { text-align: center; border: 1.5px dotted var(--accent); border-radius: 10px; padding: 6px 4px; background: var(--accent-bg); }
  .event-date .day { font-family: var(--mono); font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--accent-deep); }
  .event-date .num { font-family: var(--serif); font-weight: 700; font-size: 28px; line-height: 1; color: var(--accent-deep); margin-top: 2px; }
  .event-body h4 { font-family: var(--serif); font-weight: 600; font-size: 16px; line-height: 1.2; margin: 0 0 4px; color: var(--ink); }
  .event-body p { font-family: var(--serif); font-style: italic; font-size: 13.5px; color: var(--ink-2); margin: 0; line-height: 1.35; }
  .event-meta { font-family: var(--mono); font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); text-align: right; padding-top: 4px; line-height: 1.6; }
  .event-meta .pin { color: var(--accent-deep); font-weight: 700; }

  /* ── Health ── */
  .health-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 18px; border-top: 3px dotted var(--accent); padding-top: 22px; }
  .health-col { padding: 22px; background: var(--accent-soft); border: 1.5px dashed var(--accent); border-radius: 16px; }
  .health-col:nth-child(2) { background: var(--accent-bg); border-style: dotted; border-width: 2px; }
  .health-col .icon-frame { width: 68px; height: 68px; background: var(--accent-bg); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin-bottom: 14px; }
  .health-col h3 { font-family: var(--serif); font-weight: 600; font-size: 18px; letter-spacing: -.015em; margin: 0 0 6px; color: var(--ink); }
  .health-col .sub { font-family: var(--mono); font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--accent-deep); margin-bottom: 14px; }
  .health-col p { font-family: var(--serif); font-size: 14.5px; line-height: 1.5; color: var(--ink-2); margin: 0 0 12px; }
  .health-list { list-style: none; margin: 6px 0 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
  .health-list li { font-family: var(--serif); font-size: 14px; line-height: 1.4; display: grid; grid-template-columns: 18px 1fr; align-items: baseline; }
  .health-list li::before { content: "●"; font-family: var(--mono); color: var(--accent); font-weight: 700; font-size: 9px; padding-top: 4px; }
  .health-list li b { color: var(--ink); font-weight: 600; }
  .health-group { margin-top: 16px; }
  .health-group:first-child { margin-top: 0; }
  .health-group-label { font-family: var(--mono); font-size: 9.5px; letter-spacing: .16em; text-transform: uppercase; color: var(--accent-deep); font-weight: 700; padding-bottom: 5px; border-bottom: 1.5px dotted var(--accent); margin-bottom: 2px; }

  /* ── Discoveries ── */
  .lower-row { display: grid; grid-template-columns: 1.1fr 1fr; gap: 56px; }
  .discovery { display: grid; grid-template-columns: 1fr; gap: 0; }
  .discovery .feat { border: 2px solid var(--accent); background: var(--accent-soft); border-radius: 18px; overflow: hidden; }
  .discovery .feat-img { aspect-ratio: 16/7; background: var(--accent-bg); border-bottom: 2px dotted var(--accent); position: relative; overflow: hidden; }

// ── Helpers ───────────────────────────────────────────────────────────────────
function timeOfDay(h) {
  if (h < 5) return "night"; if (h < 12) return "morning";
  if (h < 17) return "afternoon"; if (h < 21) return "evening"; return "night";
}
function formatDate(d) {
  const days = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
  const months = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  return `${days[d.getDay()]}, ${months[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}`;
}

// ── Img ───────────────────────────────────────────────────────────────────────
function Img({ src, alt }) {
  if (!src) return null;
  return <img src={src} alt={alt || ""} style={{ width:"100%", height:"100%", objectFit:"cover", display:"block" }} />;
}

// ── Masthead ──────────────────────────────────────────────────────────────────
function Masthead() {
  return (
    <header>
      <div className="masthead">
        <div className="left"><span>{DIGEST.edition}</span><span>{DIGEST.location}</span></div>
        <div className="wordmark"><span className="digest-word">Daily Digest</span></div>

      </div>
    </header>
  );
}

// ── Greeting ──────────────────────────────────────────────────────────────────
function Greeting({ tod, name }) {
  return (
    <section className="greeting">
      <h1>Good {tod}, <span className="signature">{name}.</span></h1>
      <div className="meta">
        <div><b>Today</b> · Memorial Day, May 25 2026</div>
        <div><b>Today's read time</b> · about 28 minutes</div>
        <div><b>New since yesterday</b> · 11 stories</div>
        <div><b>Mood for today</b> · reflective &amp; rested</div>
      </div>
    </section>
  );
}

// ── Story ─────────────────────────────────────────────────────────────────────
function Story({ s, isLead }) {
  const [read, setRead] = useState(false);
  return (
    <article className={"story" + (isLead ? " lead" : "")}>
      <div className={"story-img" + (s.img ? " has-photo" : "")}>
        <Img src={s.img} alt={s.headline} />
        <span className="caption">{s.caption || s.source}</span>
      </div>
      <div className="story-body">
        <div className="story-cat">{s.category}</div>
        <h3 className="story-headline">{s.headline}</h3>
        {s.deck && <p className="story-deck">{s.deck}</p>}
        <div className="story-meta">
          <span className="bias-pill"><span className="bias-dot"></span>{s.bias} · {s.source}</span>
          <span>{s.read} read</span>
          <a href={s.url} target="_blank" rel="noopener">Open source ↗</a>
          <button className={"read-toggle" + (read ? " on" : "")} onClick={() => setRead(!read)}>
            {read ? "✓ Read" : "Mark read"}
          </button>
        </div>
      </div>
    </article>
  );
}

// ── Weather ───────────────────────────────────────────────────────────────────
function WxIcon({ ic, size = 19 }) {
  const type = (ic === "sun")  ? "sun"
             : (ic === "rain") ? "rain"
             : (ic === "☀" || ic === "🌤") ? "sun"
             : (ic && (ic.includes("🌧") || ic.includes("🌦") || ic.includes("⛈") || ic.includes("🌨") || ic.includes("❄"))) ? "rain"
             : "cloud";
  const fill = "var(--sky-deep)";
  if (type === "sun") return (
    <svg width={size} height={size} viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <circle cx="12" cy="12" r="4.5" fill={fill}/>
      {[0,45,90,135,180,225,270,315].map(a => (
        <line key={a} x1="12" y1="2.8" x2="12" y2="1.2" stroke={fill} strokeWidth="2" strokeLinecap="round" transform={`rotate(${a} 12 12)`}/>
      ))}
    </svg>
  );
  if (type === "rain") return (
    <svg width={size} height={size} viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path d="M5 14a5.5 5.5 0 0 1 10.1-3A3.5 3.5 0 1 1 17 18H5a3.5 3.5 0 0 1 0-7z" fill={fill} opacity=".7"/>
      <line x1="8"  y1="21" x2="7"  y2="23" stroke={fill} strokeWidth="1.8" strokeLinecap="round"/>
      <line x1="12" y1="21" x2="11" y2="23" stroke={fill} strokeWidth="1.8" strokeLinecap="round"/>
      <line x1="16" y1="21" x2="15" y2="23" stroke={fill} strokeWidth="1.8" strokeLinecap="round"/>
    </svg>
  );
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path d="M5 15a5.5 5.5 0 0 1 10.1-3A3.5 3.5 0 1 1 17 19H5a3.5 3.5 0 0 1 0-7z" fill={fill} opacity=".6"/>
    </svg>
  );
}

function Forecast7({ days }) {
  if (!days || !days.length) return null;
  const weekMin = Math.min(...days.map(d => d.low));
  const weekMax = Math.max(...days.map(d => d.high));
  const span = weekMax - weekMin || 1;
  return (
    <div className="forecast7">
      <div className="forecast7-title">7-Day Outlook</div>
      <div className="forecast7-grid">
        {days.map((d, i) => {
          const fillTop    = (1 - (d.high - weekMin) / span) * 100;
          const fillBottom = ((d.low  - weekMin) / span) * 100;
          return (
            <div className={`fday${i === 0 ? " today" : ""}`} key={i}>
              <span className="fday-label">{i === 0 ? "Today" : d.day}</span>
              <span className="fday-ic"><WxIcon ic={d.ic} size={15}/></span>
              <span className="fday-high">{d.high}°</span>
              <div className="fday-bar-wrap">
                <div className={`fday-bar-fill${d.rain ? " rain" : ""}`}
                     style={{ top: `${fillTop}%`, bottom: `${fillBottom}%` }}/>
              </div>
              <span className="fday-low">{d.low}°</span>
            </div>
          );
        })}
      </div>
    </div>
  );
}

function WeatherCard() {
  const w = DIGEST.weather;
  const uvLevel = (w.uv >= 8) ? "uv-high" : (w.uv >= 5) ? "uv-mod" : "uv-low";
  const rainChip = w.rain ? "chip-rain" : "chip-ok";
  const windChip = (w.wind === "Windy" || w.wind === "Breezy") ? "chip-wind" : "chip-ok";
  return (
    <aside className="weather">
      <div className="weather-head">
        <span className="tag">Weather · today</span>
        <span className="place">Manhattan</span>
      </div>
      <div className="weather-now">
        <div className="temp">{w.now}<span className="deg">°</span></div>
        <div className="weather-right">
          <div className="weather-cond">{w.condition}</div>
          <div className="weather-hl">H {w.high}° · L {w.low}° · Feels {w.feels}°</div>
        </div>
      </div>
      <div className="w-chips">
        <span className={`w-chip ${uvLevel}`}>UV {w.uv}</span>
        <span className={`w-chip ${rainChip}`}>{w.rain ? "Rain" : "No rain"}</span>
        <span className={`w-chip ${windChip}`}>{w.wind || "Calm"}</span>
      </div>
      <div className="weather-hours">
        {w.hours.map((h,i) => (
          <div className="hour" key={i}>
            <span className="h">{h.h}</span>
            <span className="ic"><WxIcon ic={h.ic} size={18}/></span>
            <span className="t">{h.t}°</span>
          </div>
        ))}
      </div>
      <Forecast7 days={w.forecast7} />
      <div className="weather-outfit">
        <div className="outfit-title">What to wear</div>
        <ul className="outfit-list">
          {(w.outfit || []).map((o,i) => (
            <li key={i}>
              <span className="outfit-label">{o.label}</span>
              <span className="outfit-val">{o.val}</span>
            </li>
          ))}
        </ul>
        <div className="sun-times">
          <span>↑ {w.sunrise}</span><span>↓ {w.sunset}</span>
        </div>
      </div>
    </aside>
  );
}

// ── Top row ───────────────────────────────────────────────────────────────────
function TopRow() {
  return (
    <section className="section theme-pink">
      <div className="kicker">
        <div className="label">

          <span className="num">i.</span>Top stories · today

// ── Technology ────────────────────────────────────────────────────────────────
function TechSection() {
  return (

      <div className="tech-grid">
        {DIGEST.tech.map((t,i) => (

// ── Events ────────────────────────────────────────────────────────────────────
function EventList({ items }) {

    <div>
      {items.map((e,i) => (
        <div className="event" key={i}>
          <div className="event-date"><div className="day">{e.day}</div><div className="num">{e.num}</div></div>
          <div className="event-body">
            <h4>{e.url ? <a href={e.url} target="_blank" rel="noopener" style={{ color:"inherit", textDecoration:"none", borderBottom:"1px solid var(--accent-bg)" }}>{e.title}</a> : e.title}</h4>
            <p>{e.blurb}</p>
          </div>
          <div className="event-meta">
            <div className="pin">{e.where}</div>
            <div>{e.time}</div>
            <div>{e.price}</div>

function EventsSection() {
  const [scope, setScope] = useState("both");

    <section className="section theme-mint">
      <div className="kicker">
        <div className="label">
          <span className="glyph"><Icon name="globe" size={48} /></span>

        <div className="scope-tabs">

      <div className="events-row">
        {(scope==="nyc"||scope==="both") && (
          <div className="events-col">
            <div className="events-head">

              <span className="span">via Eventbrite</span>
            </div>
            <EventList items={DIGEST.nycEvents} />
          </div>
        )}
        {(scope==="world"||scope==="both") && (
          <div className="events-col">
            <div className="events-head">
              <h2><span className="head-icon"><Icon name="globe" size={36} /></span><b>The world</b> <em>— at a glance</em></h2>
              <span className="span">via CBS News</span>
            </div>
            <EventList items={DIGEST.worldEvents} />
          </div>

      </div>

// ── Health ────────────────────────────────────────────────────────────────────
function HealthSection() {
  const cols = [
    { ...DIGEST.health.eat, glyph: "bowl" },
    { ...DIGEST.health.move, glyph: "shoe" },
    { ...DIGEST.health.supps, glyph: "pill" }
  ];
  return (
    <section className="section theme-peach">
      <div className="kicker">
        <div className="label">
          <span className="glyph"><Icon name="heart" size={48} /></span>
          <span className="num">iv.</span>The health desk · personal
        </div>
        <div className="tag">WebMD · Healthline · FDA · May 2026 — Not medical advice</div>
      </div>
      <div className="health-row">
        {cols.map((c,i) => (
          <div className="health-col" key={i}>
            <div className="icon-frame"><Icon name={c.glyph} size={48} /></div>
            <h3>{c.title}</h3>
            <div className="sub">{c.sub}</div>
            {c.copy && <p>{c.copy}</p>}
            {c.groups ? (
              c.groups.map((g,gi) => (
                <div className="health-group" key={gi}>
                  <div className="health-group-label">{g.label}</div>
                  <ul className="health-list">
                    {g.items.map((l,j) => <li key={j}><span><b>{l.b}</b> {l.text}</span></li>)}
                  </ul>
                </div>
              ))
            ) : (
              <ul className="health-list">
                {(c.list||[]).map((l,j) => <li key={j}><span><b>{l.b}.</b> {l.text}</span></li>)}
              </ul>
            )}
          </div>
        ))}
      </div>
    </section>
  );
}

// ── Discoveries + Long reads ──────────────────────────────────────────────────
function DiscoveriesAndReads() {
  const d = DIGEST.discoveries;
  return (
    <section className="section theme-butter">
      <div className="kicker">
        <div className="label">
          <span className="glyph"><Icon name="sparkle" size={48} /></span>
          <span className="num">v.</span>New discoveries &amp; the long read
        </div>
        <div className="tag">Science News · Phys.org · Smithsonian · Nat Geo</div>
      </div>
      <div className="lower-row">
        <div className="discovery">
          <article className="feat">
            <div className={"feat-img" + (d.feature.img ? " has-photo" : "")}>
              <Img src={d.feature.img} alt={d.feature.headline} />
              <span className="caption">{d.feature.source}</span>
            </div>
            <div className="feat-body">
              <div className="cat">{d.feature.cat}</div>
              <h3>{d.feature.headline}</h3>
              <p>{d.feature.deck}</p>
              <div className="src"><a href={d.feature.url} target="_blank" rel="noopener">{d.feature.source} ↗</a> · 7 min read</div>
            </div>
          </article>
          <div className="discovery-more">
            {d.more.map((m,i) => (
              <div className="discovery-mini" key={i}>
                <div className="field">{m.field}</div>
                <div>
                  <h4>{m.url ? <a href={m.url} target="_blank" rel="noopener" style={{ color:"inherit", textDecoration:"none" }}>{m.title}</a> : m.title}</h4>
                  <p>{m.deck}</p>
                </div>
              </div>
            ))}
          </div>
        </div>
        <div className="longreads">
          <div className="longreads-label">
            <span className="head-icon"><Icon name="book" size={32} /></span>
            Saved for the weekend
          </div>
          {DIGEST.longreads.map((l,i) => (
            <article className={"longread" + (!l.img ? " no-thumb" : "")} key={i}>
              {l.img && (
                <div className="longread-img has-photo">
                  <Img src={l.img} alt={l.headline} />
                </div>
              )}
              <div>
                <div className="longread-pub">{l.pub}</div>
                <h4><a href={l.url} target="_blank" rel="noopener" style={{ color:"inherit", textDecoration:"none" }}>{l.headline}</a></h4>
                <p>{l.deck}</p>
                <div className="meta"><span>{l.author}</span><span>· {l.read}</span></div>
              </div>
            </article>
          ))}
        </div>
      </div>
    </section>

}

// ── Colophon ──────────────────────────────────────────────────────────────────
function Colophon() {
  return (
    <footer className="colophon">
      <div><b>Daily Digest</b>Delivered every morning at 6:00 AM ET.<br />Curated, never auto-generated.</div>
      <div className="center"><b>Today's edition</b>Vol. III · No. 145 · May 25, 2026<br />Sources: CBS, ABC, TechCrunch, Eventbrite,<br />Science News, Phys.org, Smithsonian, Nat Geo</div>
      <div className="right"><b>Tomorrow</b>Memorial Day observed · markets closed<br />Weekend edition · long reads emphasized</div>
    </footer>
  );
}

// ── Tweaks ────────────────────────────────────────────────────────────────────
const ACCENT_MAP = {
  "#c64a7a": { accent:"#c64a7a", deep:"#9a3460" },
  "#3a7dbf": { accent:"#3a7dbf", deep:"#245a92" },
  "#7a55c9": { accent:"#7a55c9", deep:"#563594" },
  "#3e9c5e": { accent:"#3e9c5e", deep:"#2a7444" },
  "#d76a3a": { accent:"#d76a3a", deep:"#a04a22" },
  "#c79520": { accent:"#c79520", deep:"#8e6912" }
};

function TweaksPanel({ t, setTweak, onClose }) {
  return (
    <div className="twk-panel">
      <div className="twk-hd">
        <b>Tweaks</b>
        <button className="twk-x" onClick={onClose}>✕</button>
      </div>
      <div className="twk-body">
        <div className="twk-sect">Reader</div>
        <div className="twk-row"><div className="twk-lbl">Name</div>
          <input className="twk-field" type="text" value={t.name} onChange={e => setTweak("name", e.target.value)} />
        </div>
        <div className="twk-row"><div className="twk-lbl">Greeting</div>
          <select className="twk-field" value={t.timeOfDay} onChange={e => setTweak("timeOfDay", e.target.value)}>
            <option value="auto">Auto (by clock)</option>
            <option value="morning">Good morning</option>
            <option value="afternoon">Good afternoon</option>
            <option value="evening">Good evening</option>
          </select>
        </div>
        <div className="twk-sect">Paper</div>
        <div className="twk-row"><div className="twk-lbl">Theme</div>
          <div className="twk-seg">
            <div className="twk-seg-thumb" style={{ left: t.theme==="paper"?"2px":"calc(50% + 0px)", width:"calc(50% - 4px)" }} />
            {["paper","charcoal"].map(v => (
              <button key={v} onClick={() => setTweak("theme", v)} style={{ position:"relative",zIndex:1,flex:1,border:0,background:"transparent",font:"inherit",fontWeight:500,padding:"4px 6px",cursor:"pointer",borderRadius:6 }}>
                {v.charAt(0).toUpperCase()+v.slice(1)}
              </button>
            ))}
          </div>
        </div>
        <div className="twk-row"><div className="twk-lbl">Accent</div>
          <div className="twk-chips">
            {["#c64a7a","#3a7dbf","#7a55c9","#3e9c5e","#d76a3a","#c79520"].map(a => (
              <button key={a} className="twk-chip" data-on={t.accent===a?"1":"0"} onClick={() => setTweak("accent", a)} style={{ background: a }}>
                {t.accent===a && <svg viewBox="0 0 14 14" style={{ position:"absolute",top:6,left:6,width:13,height:13 }}><path d="M3 7.2 5.8 10 11 4.2" fill="none" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round" stroke="#fff"/></svg>}
              </button>
            ))}
          </div>
        </div>
        <div className="twk-sect">Sections</div>
        <div className="twk-row twk-row-h">
          <div className="twk-lbl">Weather advice</div>
          <button type="button" className="twk-toggle" data-on={t.showWeatherAdvice?"1":"0"} onClick={() => setTweak("showWeatherAdvice", !t.showWeatherAdvice)}><i /></button>
        </div>
      </div>
    </div>
  );
}

// ── App ───────────────────────────────────────────────────────────────────────
function App() {
  const [tweaks, setTweaksState] = useState({ name:"Amy", timeOfDay:"auto", accent:"#c64a7a", theme:"paper", showWeatherAdvice:true });
  const [panelOpen, setPanelOpen] = useState(false);
  const setTweak = (k, v) => setTweaksState(p => ({ ...p, [k]: v }));

  const tod = useMemo(() => {
    if (tweaks.timeOfDay !== "auto") return tweaks.timeOfDay;
    return timeOfDay(new Date().getHours());
  }, [tweaks.timeOfDay]);

  useEffect(() => {
    document.body.dataset.theme = tweaks.theme;
    const a = ACCENT_MAP[tweaks.accent] || ACCENT_MAP["#c64a7a"];
    document.body.style.setProperty("--pink-ink", a.accent);
    document.body.style.setProperty("--pink-deep", a.deep);
    document.body.style.setProperty("--terracotta", a.accent);
    document.body.style.setProperty("--terracotta-deep", a.deep);
  }, [tweaks.theme, tweaks.accent]);

  useEffect(() => {
    document.body.classList.toggle("hide-weather-advice", !tweaks.showWeatherAdvice);
  }, [tweaks.showWeatherAdvice]);

  return (
    <div className="digest">
      <Masthead />
      <Greeting tod={tod} name={tweaks.name} />
      <TopRow />
      <TechSection />
      <EventsSection />
      <HealthSection />
      <DiscoveriesAndReads />
      <Colophon />
      {panelOpen
        ? <TweaksPanel t={tweaks} setTweak={setTweak} onClose={() => setPanelOpen(false)} />
        : <button className="tweaks-btn" onClick={() => setPanelOpen(true)}>Tweaks ⚙</button>
      }
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
