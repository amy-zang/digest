<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Daily Digest — Sunday, May 25, 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #eaf2fb; --paper-2: #dce8f4; --paper-3: #c5d6ea;
    --ink: #0c1f3a; --ink-2: #283f64; --ink-3: #5f7894; --rule: #0c1f3a;
    --terracotta: #2563c4; --terracotta-deep: #1a4a99;
    --forest: #1f6f8b; --gold: #5677b0; --sun: #6aa6e8;
    --serif: "IBM Plex Mono", Menlo, ui-monospace, monospace;
    --mono: "JetBrains Mono", Menlo, ui-monospace, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--paper); color: var(--ink); }
  body { font-family: var(--serif); font-size: 15px; line-height: 1.55; -webkit-font-smoothing: antialiased; background-image: radial-gradient(rgba(12,31,58,.045) 1px, transparent 1px); background-size: 4px 4px; }
  .digest { max-width: 1240px; margin: 0 auto; padding: 48px 56px 96px; }

  /* Masthead */
  .masthead { display: grid; grid-template-columns: 1fr auto 1fr; align-items: end; gap: 24px; padding-bottom: 14px; border-bottom: 3px double var(--rule); }
  .masthead .left, .masthead .right { font-family: var(--mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); display: flex; flex-direction: column; gap: 4px; }
  .masthead .left { align-items: flex-start; }
  .masthead .right { align-items: flex-end; text-align: right; }
  .wordmark { font-family: var(--serif); font-weight: 600; font-size: 38px; line-height: 1; letter-spacing: -.03em; text-align: center; }
  .wordmark .amy { font-style: italic; font-weight: 500; }
  .wordmark .digest-word { font-weight: 700; letter-spacing: -.02em; }
  .submast { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--rule); padding: 8px 0; font-family: var(--mono); font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-2); }
  .submast .vol { display: flex; gap: 18px; flex-wrap: wrap; }
  .submast .dot { color: var(--terracotta); }

  /* Greeting */
  .greeting { padding: 36px 0 28px; display: grid; grid-template-columns: 1.6fr 1fr; gap: 56px; align-items: end; border-bottom: 1px solid var(--rule); }
  .greeting h1 { font-family: var(--serif); font-weight: 500; font-size: 36px; line-height: 1.15; letter-spacing: -.02em; margin: 0; color: var(--ink); }
  .greeting h1 .signature { font-style: italic; font-weight: 700; color: var(--terracotta-deep); }
  .greeting .meta { font-family: var(--mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); line-height: 1.8; }
  .greeting .meta b { color: var(--ink); font-weight: 600; }

  /* Sections */
  .section { padding: 32px 0; border-bottom: 1px solid var(--rule); }
  .kicker { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; margin-bottom: 28px; }
  .kicker .label { font-family: var(--mono); font-size: 18px; letter-spacing: .18em; text-transform: uppercase; color: var(--ink); font-weight: 600; display: flex; align-items: center; gap: 16px; }
  .kicker .label::before { content: ""; width: 32px; height: 1px; background: var(--ink); }
  .kicker .label .num { font-family: var(--serif); font-style: italic; font-weight: 500; font-size: 28px; letter-spacing: 0; text-transform: none; color: var(--terracotta); }
  .kicker .tag { font-family: var(--mono); font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); }

  /* Stories */
  .top-row { display: grid; grid-template-columns: 1.7fr 1fr; gap: 56px; }
  .stories { display: flex; flex-direction: column; }
  .story { display: grid; grid-template-columns: 200px 1fr; gap: 22px; padding: 22px 0; border-top: 1px solid var(--ink); }
  .story:first-child { border-top: none; padding-top: 0; grid-template-columns: 1fr; padding-bottom: 28px; }
  .story-img { background: var(--paper-3); border: 1px solid var(--ink); position: relative; aspect-ratio: 4/3; overflow: hidden; }
  .story:first-child .story-img { aspect-ratio: 16/8; }
  .story-img img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .story-img::before { content: ""; position: absolute; inset: 0; background-image: repeating-linear-gradient(45deg, transparent 0, transparent 8px, rgba(26,22,18,.08) 8px, rgba(26,22,18,.08) 9px); pointer-events: none; }
  .story-img.has-photo::before { display: none; }
  .story-img .caption { position: absolute; inset: auto 8px 8px 8px; font-family: var(--mono); font-size: 9.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); background: var(--paper); padding: 3px 6px; border: 1px solid var(--ink); display: inline-block; width: fit-content; }
  .story-body { display: flex; flex-direction: column; gap: 6px; }
  .story-cat { font-family: var(--mono); font-size: 10px; letter-spacing: .18em; text-transform: uppercase; color: var(--terracotta); font-weight: 600; }
  .story-headline { font-family: var(--serif); font-weight: 600; font-size: 20px; line-height: 1.2; letter-spacing: -.015em; margin: 0; color: var(--ink); }
  .story:first-child .story-headline { font-size: 26px; }
  .story-deck { font-family: var(--serif); font-style: italic; font-size: 14.5px; line-height: 1.45; color: var(--ink-2); margin: 4px 0 0; }
  .story-meta { font-family: var(--mono); font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); margin-top: 8px; display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
  .story-meta a { color: var(--ink); text-decoration: none; border-bottom: 1px solid var(--ink); padding-bottom: 1px; }
  .story-meta a:hover { color: var(--terracotta-deep); border-color: var(--terracotta-deep); }
  .bias-pill { display: inline-flex; align-items: center; gap: 6px; font-family: var(--mono); font-size: 9.5px; letter-spacing: .12em; padding: 2px 7px; border: 1px solid var(--ink); color: var(--ink); text-transform: uppercase; background: var(--paper-2); }
  .bias-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--forest); display: inline-block; }

  /* Weather */
  .weather { border: 1px solid var(--ink); background: linear-gradient(180deg, var(--paper-2) 0%, var(--paper) 100%); padding: 22px; display: flex; flex-direction: column; gap: 16px; }
  .weather-head { display: flex; justify-content: space-between; align-items: baseline; border-bottom: 1px solid var(--ink); padding-bottom: 10px; }
  .weather-head .tag { font-family: var(--mono); font-size: 10px; letter-spacing: .2em; text-transform: uppercase; color: var(--ink-2); }
  .weather-head .place { font-family: var(--serif); font-style: italic; font-size: 18px; color: var(--ink); }
  .weather-now { display: grid; grid-template-columns: 1fr auto; gap: 14px; align-items: center; }
  .temp { font-family: var(--serif); font-weight: 600; font-size: 60px; line-height: .95; letter-spacing: -.05em; color: var(--ink); display: flex; align-items: flex-start; }
  .temp .deg { font-size: 28px; font-weight: 500; margin-top: 8px; color: var(--terracotta); }
  .sun-glyph { width: 90px; height: 90px; position: relative; }
  .sun-glyph .core { position: absolute; inset: 22%; border-radius: 50%; background: var(--sun); box-shadow: 0 0 0 4px var(--paper-2), 0 0 0 5px var(--gold); }
  .sun-glyph::before { content: ""; position: absolute; inset: 0; background: conic-gradient(from 0deg, var(--sun) 0deg 6deg, transparent 6deg 45deg, var(--sun) 45deg 51deg, transparent 51deg 90deg, var(--sun) 90deg 96deg, transparent 96deg 135deg, var(--sun) 135deg 141deg, transparent 141deg 180deg, var(--sun) 180deg 186deg, transparent 186deg 225deg, var(--sun) 225deg 231deg, transparent 231deg 270deg, var(--sun) 270deg 276deg, transparent 276deg 315deg, var(--sun) 315deg 321deg, transparent 321deg 360deg); -webkit-mask: radial-gradient(circle, transparent 32%, #000 33%, #000 46%, transparent 47%); mask: radial-gradient(circle, transparent 32%, #000 33%, #000 46%, transparent 47%); }
  .weather-cond { font-family: var(--serif); font-style: italic; font-size: 17px; color: var(--ink-2); margin-top: -4px; }
  .weather-cond b { font-style: normal; font-weight: 600; color: var(--ink); }
  .weather-hours { display: grid; grid-template-columns: repeat(5, 1fr); border: 1px solid var(--ink); background: var(--paper); }
  .hour { text-align: center; padding: 8px 0; border-right: 1px solid var(--ink-3); display: flex; flex-direction: column; gap: 4px; }
  .hour:last-child { border-right: none; }
  .hour .h { font-family: var(--mono); font-size: 9.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); }
  .hour .t { font-family: var(--serif); font-size: 17px; font-weight: 600; }
  .hour .ic { font-size: 14px; }
  .weather-advice { border-top: 1px dashed var(--ink-3); padding-top: 14px; }
  .advice-title { font-family: var(--mono); font-size: 10.5px; letter-spacing: .18em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 8px; }
  .advice-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  .advice-list li { font-family: var(--serif); font-size: 13.5px; line-height: 1.35; display: grid; grid-template-columns: 22px 1fr; gap: 4px; color: var(--ink); }
  .advice-list li .mark { font-family: var(--mono); font-weight: 600; color: var(--terracotta); font-size: 13px; }

  /* Tech */
  .tech-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0; border-top: 1px solid var(--ink); }
  .tech-card { padding: 22px 24px 22px 0; border-right: 1px solid var(--ink); display: flex; flex-direction: column; gap: 8px; }
  .tech-card + .tech-card { padding-left: 24px; }
  .tech-card:last-child { border-right: none; padding-right: 0; }
  .tech-img { aspect-ratio: 16/9; background: var(--paper-3); border: 1px solid var(--ink); overflow: hidden; margin-bottom: 4px; position: relative; }
  .tech-img img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .tech-img::before { content: ""; position: absolute; inset: 0; background-image: repeating-linear-gradient(45deg, transparent 0, transparent 8px, rgba(26,22,18,.06) 8px, rgba(26,22,18,.06) 9px); pointer-events: none; }
  .tech-img.has-photo::before { display: none; }
  .tech-num { font-family: var(--serif); font-style: italic; font-size: 24px; font-weight: 500; color: var(--terracotta); line-height: 1; }
  .tech-card h3 { font-family: var(--serif); font-weight: 600; font-size: 15.5px; line-height: 1.25; letter-spacing: -.015em; margin: 2px 0 0; color: var(--ink); }
  .tech-card p { font-family: var(--serif); font-size: 14px; line-height: 1.45; color: var(--ink-2); margin: 2px 0 0; }
  .tech-card .src { font-family: var(--mono); font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-3); margin-top: auto; padding-top: 14px; display: flex; justify-content: space-between; }
  .tech-card .src a { color: var(--ink); border-bottom: 1px solid var(--ink); text-decoration: none; padding-bottom: 1px; }

  /* Events */
  .events-row { display: grid; grid-template-columns: 1fr 1fr; gap: 0; }
  .events-col { padding: 0; }
  .events-col + .events-col { border-left: 1px solid var(--ink); padding-left: 36px; }
  .events-col:first-child { padding-right: 36px; }
  .events-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 16px; }
  .events-head h2 { font-family: var(--serif); font-weight: 500; font-size: 22px; letter-spacing: -.02em; margin: 0; color: var(--ink); }
  .events-head h2 b { font-weight: 700; color: var(--terracotta-deep); }
  .events-head .span { font-family: var(--mono); font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-3); }
  .event { display: grid; grid-template-columns: 64px 1fr auto; gap: 14px; padding: 14px 0; border-top: 1px solid var(--ink-3); align-items: start; }
  .event-date { text-align: center; border: 1px solid var(--ink); padding: 6px 4px; background: var(--paper-2); }
  .event-date .day { font-family: var(--mono); font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-2); }
  .event-date .num { font-family: var(--serif); font-weight: 700; font-size: 28px; line-height: 1; color: var(--ink); margin-top: 2px; }
  .event-body h4 { font-family: var(--serif); font-weight: 600; font-size: 16px; line-height: 1.2; margin: 0 0 4px; color: var(--ink); }
  .event-body p { font-family: var(--serif); font-style: italic; font-size: 13.5px; color: var(--ink-2); margin: 0; line-height: 1.35; }
  .event-meta { font-family: var(--mono); font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); text-align: right; padding-top: 4px; line-height: 1.6; }
  .event-meta .pin { color: var(--forest); font-weight: 600; }

  /* Health */
  .health-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0; border-top: 1px solid var(--ink); }
  .health-col { padding: 22px 24px; border-right: 1px solid var(--ink); }
  .health-col:first-child { padding-left: 0; }
  .health-col:last-child { border-right: none; padding-right: 0; }
  .health-col .icon-frame { width: 56px; height: 56px; border: 1px solid var(--ink); background: var(--paper-2); display: flex; align-items: center; justify-content: center; margin-bottom: 14px; font-family: var(--serif); font-style: italic; font-weight: 600; font-size: 26px; color: var(--terracotta); }
  .health-col h3 { font-family: var(--serif); font-weight: 600; font-size: 18px; letter-spacing: -.015em; margin: 0 0 6px; color: var(--ink); }
  .health-col .sub { font-family: var(--mono); font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 14px; }
  .health-col p { font-family: var(--serif); font-size: 14.5px; line-height: 1.5; color: var(--ink-2); margin: 0 0 12px; }
  .health-list { list-style: none; margin: 8px 0 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
  .health-list li { font-family: var(--serif); font-size: 14px; line-height: 1.4; display: grid; grid-template-columns: 18px 1fr; align-items: baseline; }
  .health-list li::before { content: "+"; font-family: var(--mono); color: var(--terracotta); font-weight: 600; }
  .health-list li b { color: var(--ink); font-weight: 600; }

  /* Discoveries */
  .lower-row { display: grid; grid-template-columns: 1.1fr 1fr; gap: 56px; }
  .discovery { display: flex; flex-direction: column; gap: 0; }
  .feat { border: 1px solid var(--ink); background: var(--paper-2); }
  .feat-img { aspect-ratio: 16/7; background: var(--paper-3); border-bottom: 1px solid var(--ink); position: relative; overflow: hidden; }
  .feat-img img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .feat-img::before { content: ""; position: absolute; inset: 0; background: radial-gradient(circle at 30% 40%, rgba(63,90,69,.18), transparent 40%), radial-gradient(circle at 70% 60%, rgba(179,85,47,.14), transparent 50%), repeating-linear-gradient(135deg, transparent 0 12px, rgba(26,22,18,.05) 12px 13px); pointer-events: none; }
  .feat-img.has-photo::before { display: none; }
  .feat-img .caption { position: absolute; bottom: 10px; left: 10px; font-family: var(--mono); font-size: 9.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-2); background: var(--paper); padding: 4px 7px; border: 1px solid var(--ink); }
  .feat-body { padding: 20px 22px 22px; }
  .feat-body .cat { font-family: var(--mono); font-size: 10px; letter-spacing: .18em; text-transform: uppercase; color: var(--forest); font-weight: 600; }
  .feat-body h3 { font-family: var(--serif); font-weight: 600; font-size: 20px; line-height: 1.25; letter-spacing: -.015em; margin: 6px 0; color: var(--ink); }
  .feat-body p { font-family: var(--serif); font-style: italic; font-size: 15px; line-height: 1.45; color: var(--ink-2); margin: 0; }
  .feat-body .src { font-family: var(--mono); font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-3); margin-top: 12px; }
  .feat-body .src a { color: var(--ink); border-bottom: 1px solid var(--ink); text-decoration: none; padding-bottom: 1px; }
  .discovery-more { margin-top: 16px; display: flex; flex-direction: column; }
  .discovery-mini { display: grid; grid-template-columns: auto 1fr; gap: 14px; padding: 12px 0; border-top: 1px dashed var(--ink-3); }
  .discovery-mini:first-child { border-top: none; }
  .discovery-mini .field { font-family: var(--mono); font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--forest); font-weight: 600; align-self: start; padding-top: 4px; min-width: 100px; }
  .discovery-mini h4 { font-family: var(--serif); font-weight: 600; font-size: 15.5px; line-height: 1.25; margin: 0; color: var(--ink); }
  .discovery-mini p { font-family: var(--serif); font-size: 13.5px; line-height: 1.4; color: var(--ink-2); margin: 4px 0 0; font-style: italic; }

  /* Long reads */
  .longreads { display: flex; flex-direction: column; }
  .longread { padding: 18px 0; border-top: 1px solid var(--ink-3); display: grid; grid-template-columns: 88px 1fr; gap: 18px; }
  .longread:first-child { border-top: none; padding-top: 0; }
  .longread.no-thumb { grid-template-columns: 1fr; }
  .longread-img { aspect-ratio: 1/1; background: var(--paper-3); border: 1px solid var(--ink); position: relative; overflow: hidden; }
  .longread-img img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .longread-img::before { content: ""; position: absolute; inset: 0; background-image: repeating-linear-gradient(90deg, transparent 0 6px, rgba(26,22,18,.08) 6px 7px); pointer-events: none; }
  .longread-img.has-photo::before { display: none; }
  .longread-pub { font-family: var(--mono); font-size: 10px; letter-spacing: .18em; text-transform: uppercase; color: var(--terracotta); font-weight: 600; }
  .longread h4 { font-family: var(--serif); font-weight: 600; font-size: 17px; line-height: 1.2; margin: 4px 0; color: var(--ink); }
  .longread p { font-family: var(--serif); font-style: italic; font-size: 13.5px; line-height: 1.35; color: var(--ink-2); margin: 0; }
  .longread .meta { font-family: var(--mono); font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); margin-top: 8px; display: flex; gap: 12px; }

  /* Colophon */
  .colophon { margin-top: 40px; padding: 24px 0 0; border-top: 3px double var(--rule); display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 32px; font-family: var(--mono); font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-3); }
  .colophon b { color: var(--ink); font-weight: 600; display: block; margin-bottom: 6px; }
  .colophon .right { text-align: right; }
  .colophon .center { text-align: center; }

  /* Interactive */
  .read-toggle { background: none; border: 1px solid var(--ink); padding: 4px 10px; font-family: var(--mono); font-size: 10px; letter-spacing: .12em; text-transform: uppercase; cursor: pointer; color: var(--ink); transition: background 120ms; }
  .read-toggle:hover { background: var(--paper-3); }
  .read-toggle.on { background: var(--ink); color: var(--paper); }
  .scope-tabs { display: inline-flex; border: 1px solid var(--ink); }
  .scope-tabs button { background: none; border: none; padding: 6px 12px; font-family: var(--mono); font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-2); cursor: pointer; border-right: 1px solid var(--ink); }
  .scope-tabs button:last-child { border-right: none; }
  .scope-tabs button.on { background: var(--ink); color: var(--paper); }

  /* Dark */
  body[data-theme="charcoal"] { --paper: #0c1a2e; --paper-2: #142540; --paper-3: #1e3257; --ink: #e6f0fb; --ink-2: #b9cce6; --ink-3: #7a92b7; --rule: #e6f0fb; --terracotta: #6aa6e8; --terracotta-deep: #9ec4f0; --forest: #7fbacc; --gold: #aac0e0; --sun: #9ec4f0; }
  body.hide-weather-advice .weather-advice { display: none; }

  /* Tweaks */
  .tweaks-btn { position: fixed; right: 16px; bottom: 16px; z-index: 100; appearance: none; border: 1px solid var(--ink); background: var(--paper-2); color: var(--ink); font-family: var(--mono); font-size: 10px; letter-spacing: .12em; text-transform: uppercase; padding: 8px 14px; cursor: pointer; }
  .tweaks-btn:hover { background: var(--paper-3); }
  .twk-panel { position: fixed; right: 16px; bottom: 16px; z-index: 200; width: 280px; max-height: calc(100vh - 32px); display: flex; flex-direction: column; background: rgba(250,249,247,.95); color: #29261b; -webkit-backdrop-filter: blur(24px); backdrop-filter: blur(24px); border: .5px solid rgba(255,255,255,.6); border-radius: 14px; box-shadow: 0 12px 40px rgba(0,0,0,.2); font: 11.5px/1.4 ui-sans-serif, system-ui, sans-serif; overflow: hidden; }
  .twk-hd { display: flex; align-items: center; justify-content: space-between; padding: 10px 8px 10px 14px; cursor: move; user-select: none; border-bottom: 1px solid rgba(0,0,0,.08); }
  .twk-hd b { font-size: 12px; font-weight: 600; }
  .twk-x { appearance: none; border: 0; background: transparent; color: rgba(41,38,27,.55); width: 22px; height: 22px; border-radius: 6px; cursor: pointer; font-size: 13px; }
  .twk-x:hover { background: rgba(0,0,0,.06); }
  .twk-body { padding: 8px 14px 14px; display: flex; flex-direction: column; gap: 10px; overflow-y: auto; }
  .twk-sect { font-size: 10px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: rgba(41,38,27,.45); padding: 6px 0 2px; }
  .twk-row { display: flex; flex-direction: column; gap: 5px; }
  .twk-row-h { flex-direction: row; align-items: center; justify-content: space-between; gap: 10px; }
  .twk-lbl { font-weight: 500; color: rgba(41,38,27,.72); }

// ── Helpers ───────────────────────────────────────────────────────────────────
function timeOfDay(h) {
  if (h < 5) return "night"; if (h < 12) return "morning";
  if (h < 17) return "afternoon"; if (h < 21) return "evening"; return "night";
}
function formatDate(d) {
  const days = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
  const months = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  return `${days[d.getDay()]}, ${months[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}`;
}

      {items.map((e,i) => (
        <div className="event" key={i}>
          <div className="event-date"><div className="day">{e.day}</div><div className="num">{e.num}</div></div>
          <div className="event-body">
            <h4>{e.url ? <a href={e.url} target="_blank" rel="noopener" style={{ color:"inherit", textDecoration:"none", borderBottom:"1px solid var(--ink-3)" }}>{e.title}</a> : e.title}</h4>
            <p>{e.blurb}</p>
          </div>
          <div className="event-meta">
            <div className="pin">{e.where}</div>
            <div>{e.time}</div>
            <div>{e.price}</div>
          </div>
        </div>
      ))}
    </div>
  );
}

function EventsSection() {
  const [scope, setScope] = useState("both");
  return (
    <section className="section">
      <div className="kicker">
        <div className="label"><span className="num">iii.</span>This week · May 25–31</div>
        <div className="scope-tabs">
          {["nyc","world","both"].map(s => (
            <button key={s} className={scope===s?"on":""} onClick={() => setScope(s)}>{s.toUpperCase()}</button>
          ))}
        </div>
      </div>
      <div className="events-row">
        {(scope==="nyc"||scope==="both") && (
          <div className="events-col">
            <div className="events-head">
              <h2><b>New York</b> <em>— happening near you</em></h2>
              <span className="span">via Eventbrite</span>
            </div>
            <EventList items={DIGEST.nycEvents} />
          </div>
        )}
        {(scope==="world"||scope==="both") && (
          <div className="events-col">
            <div className="events-head">
              <h2><b>The world</b> <em>— at a glance</em></h2>
              <span className="span">via CBS News</span>
            </div>
            <EventList items={DIGEST.worldEvents} />
          </div>
        )}
      </div>
    </section>
  );
}

// ── Health ────────────────────────────────────────────────────────────────────
function HealthSection() {
  const cols = [
    { ...DIGEST.health.eat, glyph: "e" },
    { ...DIGEST.health.move, glyph: "m" },
    { ...DIGEST.health.supps, glyph: "s" }
  ];
  return (
    <section className="section">
      <div className="kicker">
        <div className="label"><span className="num">iv.</span>The health desk · personal</div>
        <div className="tag">WebMD · Healthline · FDA · May 2026 — Not medical advice</div>
      </div>
      <div className="health-row">
        {cols.map((c,i) => (
          <div className="health-col" key={i}>
            <div className="icon-frame">{c.glyph}</div>
            <h3>{c.title}</h3>
            <div className="sub">{c.sub}</div>
            <p>{c.copy}</p>
            <ul className="health-list">
              {c.list.map((l,j) => <li key={j}><span><b>{l.b}.</b> {l.text}</span></li>)}
            </ul>
          </div>
        ))}
      </div>
    </section>
  );
}

// ── Discoveries + Long reads ──────────────────────────────────────────────────
function DiscoveriesAndReads() {
  const d = DIGEST.discoveries;
  return (
    <section className="section">
      <div className="kicker">
        <div className="label"><span className="num">v.</span>New discoveries &amp; the long read</div>
        <div className="tag">Science News · Phys.org · Smithsonian · Nat Geo</div>
      </div>
      <div className="lower-row">
        <div className="discovery">
          <article className="feat">
            <div className="feat-img has-photo">
              <Img src={d.feature.img} alt={d.feature.headline} />
              <span className="caption">{d.feature.source}</span>
            </div>
            <div className="feat-body">
              <div className="cat">{d.feature.cat}</div>
              <h3>{d.feature.headline}</h3>
              <p>{d.feature.deck}</p>
              <div className="src"><a href={d.feature.url} target="_blank" rel="noopener">{d.feature.source} ↗</a> · 7 min read</div>
            </div>
          </article>
          <div className="discovery-more">
            {d.more.map((m,i) => (
              <div className="discovery-mini" key={i}>
                <div className="field">{m.field}</div>
                <div>
                  <h4>{m.url ? <a href={m.url} target="_blank" rel="noopener" style={{ color:"inherit", textDecoration:"none" }}>{m.title}</a> : m.title}</h4>
                  <p>{m.deck}</p>
                </div>
              </div>
            ))}
          </div>
        </div>
        <div className="longreads">
          <div style={{ fontFamily:"var(--mono)", fontSize:11, letterSpacing:"0.18em", textTransform:"uppercase", color:"var(--ink)", fontWeight:600, marginBottom:10 }}>
            Saved for the weekend
          </div>
          {DIGEST.longreads.map((l,i) => (
            <article className={"longread" + (!l.img ? " no-thumb" : "")} key={i}>
              {l.img && (
                <div className="longread-img has-photo">
                  <Img src={l.img} alt={l.headline} />
                </div>
              )}
              <div>
                <div className="longread-pub">{l.pub}</div>
                <h4><a href={l.url} target="_blank" rel="noopener" style={{ color:"inherit", textDecoration:"none" }}>{l.headline}</a></h4>
                <p>{l.deck}</p>
                <div className="meta"><span>{l.author}</span><span>· {l.read}</span></div>
              </div>
            </article>
          ))}
        </div>
      </div>
    </section>
  );
}

// ── Colophon ──────────────────────────────────────────────────────────────────
function Colophon() {
  return (
    <footer className="colophon">
      <div><b>Daily Digest</b>Delivered every morning at 6:00 AM ET.<br />Curated, never auto-generated.</div>
      <div className="center"><b>Today's edition</b>Vol. III · No. 145 · May 25, 2026<br />Sources: CBS, ABC, TechCrunch, Eventbrite,<br />Science News, Phys.org, Smithsonian, Nat Geo</div>
      <div className="right"><b>Tomorrow</b>Memorial Day observed · markets closed<br />Weekend edition · long reads emphasized</div>
    </footer>
  );
}

// ── Tweaks ────────────────────────────────────────────────────────────────────
const ACCENT_MAP = {
  "#2563c4": { accent:"#2563c4", deep:"#1a4a99" },
  "#3c8dbc": { accent:"#3c8dbc", deep:"#246a8e" },
  "#1f6f8b": { accent:"#1f6f8b", deep:"#13556e" },
  "#5b6fb5": { accent:"#5b6fb5", deep:"#3f5293" }
};

function TweaksPanel({ t, setTweak, onClose }) {
  return (
    <div className="twk-panel">
      <div className="twk-hd">
        <b>Tweaks</b>
        <button className="twk-x" onClick={onClose}>✕</button>
      </div>
      <div className="twk-body">
        <div className="twk-sect">Reader</div>
        <div className="twk-row"><div className="twk-lbl">Name</div>
          <input className="twk-field" type="text" value={t.name} onChange={e => setTweak("name", e.target.value)} />
        </div>
        <div className="twk-row"><div className="twk-lbl">Greeting</div>
          <select className="twk-field" value={t.timeOfDay} onChange={e => setTweak("timeOfDay", e.target.value)}>
            <option value="auto">Auto (by clock)</option>
            <option value="morning">Good morning</option>
            <option value="afternoon">Good afternoon</option>
            <option value="evening">Good evening</option>
          </select>
        </div>
        <div className="twk-sect">Paper</div>
        <div className="twk-row"><div className="twk-lbl">Theme</div>
          <div className="twk-seg">
            <div className="twk-seg-thumb" style={{ left: t.theme==="paper"?"2px":"calc(50% + 0px)", width:"calc(50% - 4px)" }} />
            {["paper","charcoal"].map(v => (
              <button key={v} onClick={() => setTweak("theme", v)} style={{ position:"relative",zIndex:1,flex:1,border:0,background:"transparent",font:"inherit",fontWeight:500,padding:"4px 6px",cursor:"pointer",borderRadius:6 }}>
                {v.charAt(0).toUpperCase()+v.slice(1)}
              </button>
            ))}
          </div>
        </div>
        <div className="twk-row"><div className="twk-lbl">Accent</div>
          <div className="twk-chips">
            {["#2563c4","#3c8dbc","#1f6f8b","#5b6fb5"].map(a => (
              <button key={a} className="twk-chip" data-on={t.accent===a?"1":"0"} onClick={() => setTweak("accent", a)} style={{ background: a }}>
                {t.accent===a && <svg viewBox="0 0 14 14" style={{ position:"absolute",top:6,left:6,width:13,height:13 }}><path d="M3 7.2 5.8 10 11 4.2" fill="none" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round" stroke="#fff"/></svg>}
              </button>
            ))}
          </div>
        </div>
        <div className="twk-sect">Sections</div>
        <div className="twk-row twk-row-h">
          <div className="twk-lbl">Weather advice</div>
          <button type="button" className="twk-toggle" data-on={t.showWeatherAdvice?"1":"0"} onClick={() => setTweak("showWeatherAdvice", !t.showWeatherAdvice)}><i /></button>
        </div>
      </div>
    </div>
  );
}

// ── App ───────────────────────────────────────────────────────────────────────
function App() {
  const [tweaks, setTweaksState] = useState({ name:"", timeOfDay:"auto", accent:"#2563c4", theme:"paper", showWeatherAdvice:true });
  const [panelOpen, setPanelOpen] = useState(false);
  const setTweak = (k, v) => setTweaksState(p => ({ ...p, [k]: v }));

  const tod = useMemo(() => {
    if (tweaks.timeOfDay !== "auto") return tweaks.timeOfDay;
    return timeOfDay(new Date().getHours());
  }, [tweaks.timeOfDay]);

  useEffect(() => {
    document.body.dataset.theme = tweaks.theme;
    const a = ACCENT_MAP[tweaks.accent] || ACCENT_MAP["#2563c4"];
    document.body.style.setProperty("--terracotta", a.accent);
    document.body.style.setProperty("--terracotta-deep", a.deep);
  }, [tweaks.theme, tweaks.accent]);

  useEffect(() => {
    document.body.classList.toggle("hide-weather-advice", !tweaks.showWeatherAdvice);
  }, [tweaks.showWeatherAdvice]);

  return (
    <div className="digest">
      <Masthead />
      <Greeting tod={tod} name={tweaks.name} />
      <TopRow />
      <TechSection />
      <EventsSection />
      <HealthSection />
      <DiscoveriesAndReads />
      <Colophon />
      {panelOpen
        ? <TweaksPanel t={tweaks} setTweak={setTweak} onClose={() => setPanelOpen(false)} />
        : <button className="tweaks-btn" onClick={() => setPanelOpen(true)}>Tweaks ⚙</button>
      }
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
